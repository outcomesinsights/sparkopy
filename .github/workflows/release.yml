name: Release

# A pushed v* tag builds static (musl) linux/amd64 and linux/arm64 binaries and attaches them,
# with a SHA256SUMS file, to a GitHub release named after the tag.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1"
      # zig and cargo-zigbuild, pinned in mise.toml, link the static musl binaries for both
      # architectures. No tool cache in a release job.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: zig aqua:rust-cross/cargo-zigbuild
          cache: false
      # The version in rust-toolchain.toml: change both together. No cargo cache in a release job.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - run: just release-assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            dist/release/sparkopy-linux-amd64 \
            dist/release/sparkopy-linux-arm64 \
            dist/release/SHA256SUMS
