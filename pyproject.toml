[project]
name = "sparkopy"
version = "0.0.1"
authors = [
  { name="Ryan Duryea", email="aguynamedryan+oss@gmail.com" },
]
description = "Downloads tables from Spark and outputs them as Parquet files"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "click==8.5.0",
  "databricks-connect==16.1.7",
  "grpcio",
  "grpcio-status",
  "pandas==2.3.3",
  "protobuf",
  "pyarrow==24.0.0",
  "pyasn1>=0.6.3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/outcomesinsights/sparkopy"
Issues = "https://github.com/outcomesinsights/sparkopy/issues"

[project.scripts]
sparkopy = "sparkopy:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "setuptools>=82.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
